services:
  # 1. PostgreSQL Database Service (With WAL-G Built-In)
  postgres_db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres_prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /etc/wal-g.env
        echo "$${WALG_S3_PREFIX}" > /etc/wal-g.env/WALG_S3_PREFIX
        echo "$${AWS_ACCESS_KEY_ID}" > /etc/wal-g.env/AWS_ACCESS_KEY_ID
        echo "$${AWS_SECRET_ACCESS_KEY}" > /etc/wal-g.env/AWS_SECRET_ACCESS_KEY
        echo "$${AWS_ENDPOINT}" > /etc/wal-g.env/AWS_ENDPOINT
        echo "$${AWS_REGION}" > /etc/wal-g.env/AWS_REGION
        echo "$${POSTGRES_USER}" > /etc/wal-g.env/PGUSER
        echo "/var/run/postgresql" > /etc/wal-g.env/PGHOST
        exec docker-entrypoint.sh "$$@"
      - "--"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. PgBouncer Connection Pooler Service
  pgbouncer:
    image: bitnami/pgbouncer:1.24.0-debian-12
    container_name: pgbouncer_prod
    restart: always
    ports:
      - "6432:6432" # Saare Go/Rust servers isi port par connect karenge
    env_file:
      - .env.prod
    environment:
      - PGBOUNCER_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_PORT_NUMBER=${PGBOUNCER_PORT}
      - POSTGRESQL_HOST=postgres_db
      - POSTGRESQL_PORT_NUMBER=5432
      - POSTGRESQL_USER=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_POOL_MODE=${PGBOUNCER_POOL_MODE}
      - PGBOUNCER_MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN}
      - PGBOUNCER_DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE}
      - PGBOUNCER_STATS_USERS=${POSTGRES_USER}
      - POSTGRESQL_CLIENT_MIN_MESSAGES=error
    depends_on:
      - postgres_db
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_prod_data:
    name: postgres_prod_data

networks:
  shared_net:
    external: true
    name: global_shared_network
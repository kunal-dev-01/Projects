# --------------------------------------
# CONNECTIONS AND SECURITY
# --------------------------------------
listen_addresses = '*'
max_connections = 50
port = 5432

# ---------------------------------------
# WRITE AHEAD LOG (WAL) & WAL-G ARCHIVING
# ---------------------------------------
wal_level = replica
archive_mode = on
archive_command = 'envdir /etc/wal-g.env wal-g wal-push %p'
archive_timeout = 600

# ---------------------------------------
# MEMORY TUNING ( FOR 8GB RAM VM)
# ---------------------------------------
shared_buffers = 1.5GB
work_mem = 16MB
maintenance_work_mem = 512MB
effective_cache_size = 4GB

# =====================================================
# Docker Compose for Postgres development
# =====================================================

services:
  db:
    image: postgres:16-bookworm
    container_name: postgres_dev
    restart: unless-stopped
    env_file: .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admin_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    # Dev Memory Optimization Limits (Lightweight for local PC)
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - dev_shared_net
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-admin_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: migrate/migrate:v4.15.2
    container_name: postgres_migrate
    restart: "no"
    env_file: .env.dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev_shared_net
    command: [ "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-admin_db}?sslmode=disable" ]
    volumes:
      - ../../migrations:/migrations

volumes:
  postgres_dev_data:
    name: postgres_dev_data

networks:
  dev_shared_net:
    external: true
    name: dev_shared_network
